    var serviceWorkerVersion = null;

<body>
<!-- Loading indicator -->
<div id="loading">
  <style>
      body {
        inset: 0;
        overflow: hidden;
        margin: 0;
        padding: 0;
        position: fixed;
      }

      #loading {
        align-items: center;
        display: flex;
        height: 100%;
        justify-content: center;
        width: 100%;
      }

      #loading img {
        animation: 1s ease-in-out 0s infinite alternate breathe;
        opacity: .66;
        transition: opacity .4s;
      }

      #loading.main_done img {
        opacity: 1;
      }

      @keyframes breathe {
        from {
          transform: scale(1)
        }

        to {
          transform: scale(0.95)
        }
      }
    </style>
  <img src="icons/Icon-192.png" alt="Loading indicator..." />
</div>
<script>
    const config = {
      canvasKitBaseUrl: "./canvaskit/"
    };
    window.addEventListener('load', function () {
      var loading = document.querySelector('#loading');
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        }
      }).then(function (engineInitializer) {
        loading.classList.add('main_done');
        return engineInitializer.initializeEngine(config);
      }).then(function (appRunner) {
        return appRunner.runApp();
      }).then(function (app) {
        loading.remove();
      });
    });
    // load serviceworker earlier
    const serviceWorkerActivation = navigator.serviceWorker.register(
      "flutter_service_worker.js?v=" + serviceWorkerVersion
    );
  </script>
  <script>
      const wait_until = setInterval(() => {
        var elt = document.querySelector('flt-glass-pane');
        if (elt) {
          clearInterval(wait_until);
          var sheet = new CSSStyleSheet;
          sheet.replaceSync('flt-scene-host * p, flt-scene-host * canvas { image-rendering: pixelated; }');
          elt.shadowRoot.adoptedStyleSheets = [sheet];
        }
      }, 500);
  </script>
</body>
</html>
