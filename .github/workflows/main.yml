# .github/workflows/backfill.yml
name: Backfill
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # keep if you use google-github-actions/auth (WIF)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      # 🔧 Cleanup: remove stale submodule metadata & config (temporary)
      - name: Clear stale submodule metadata (temporary)
        run: |
          rm -rf .git/modules/depot_tools || true
          git config -f .gitmodules --remove-section submodule.depot_tools || true
          git config --local --remove-section submodule.depot_tools || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # cache removed to avoid "lock file not found" error

      - name: Install deps (root or Scripts/)
        shell: bash
        run: |
          set -e
          if [ -f package.json ]; then
            if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
              npm ci
            else
              npm install --no-audit --no-fund
            fi
          elif [ -f Scripts/package.json ]; then
            if [ -f Scripts/package-lock.json ]; then
              npm ci --prefix Scripts
            else
              npm install --prefix Scripts --no-audit --no-fund
            fi
          else
            echo "No package.json found in repo root or Scripts/; nothing to install."
          fi

      - name: Detect script
        id: detect
        run: echo "path=Scripts/backfi
