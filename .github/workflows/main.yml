name: Backfill
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Clear stale submodule metadata (temporary)
        run: |
          rm -rf .git/modules/depot_tools || true
          git config -f .gitmodules --remove-section submodule.depot_tools || true
          git config --local --remove-section submodule.depot_tools || true

      - name: Auth to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}
          project_id: ${{ vars.GCP_PROJECT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps (root or Scripts/)
        shell: bash
        run: |
          set -e
          if [ -f Scripts/package.json ]; then
            if [ -f Scripts/package-lock.json ]; then
              npm ci --prefix Scripts
            else
              npm install --prefix Scripts --no-audit --no-fund
            fi
          elif [ -f package.json ]; then
            if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
              npm ci
            else
              npm install --no-audit --no-fund
            fi
          fi

      - name: Detect script
        id: detect
        run: echo "path=Scripts/backfill.ts" >> "$GITHUB_OUTPUT"

      - name: Verify backfill.ts path and print header
        shell: bash
        run: |
          set -e
          echo "PWD: $(pwd)"
          test -f Scripts/backfill.ts || { echo "MISSING: Scripts/backfill.ts"; find . -maxdepth 3 -type f -name 'backfill.ts'; exit 1; }
          sed -n '1,60p' Scripts/backfill.ts

      # ✅ Verify the file exists (case-sensitive path!) and show its first lines
      - name: Verify backfill.ts path and print header
        shell: bash
        run: |
          set -e
          echo "PWD: $(pwd)"
          test -f Scripts/backfill.ts || { echo "MISSING: Scripts/backfill.ts (did you mean 'Scripts' not 'Scrips'?)"; find . -maxdepth 3 -type f -name 'backfill.ts'; exit 1; }
          sed -n '1,60p' Scripts/backfill.ts

      - name: Run backfill (TS/JS)
        shell: bash
        env:
          NODE_OPTIONS: --enable-source-maps
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
        run: |
          set -e
          SCRIPT="${{ steps.detect.outputs.path }}"
          case "$SCRIPT" in
            *.ts)
              if [ -f Scripts/package.json ]; then
                npx --prefix Scripts ts-node --transpile-only "$SCRIPT"
              else
                npx ts-node --transpile-only "$SCRIPT"
              fi
              ;;
            *.js) node "$SCRIPT" ;;
          esac
